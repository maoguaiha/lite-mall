server:
  port: 8081

spring:
  application:
    name: mall-admin
  datasource:
    # 与 mall-portal 共享同一物理库（../mall-shared 在两个模块目录下都解析到 mall-lite/mall-shared），
    # 使商家端创建的秒杀活动对用户端可见（秒杀数据隔离修复）。AUTO_SERVER 允许多进程并发访问。
    # 使用占位符以便通过环境变量 / 系统属性 / 命令行覆盖（host 模式下由 mall-lite.ps1 注入 TCP 地址）。
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:../mall-shared;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql,classpath*:schema-modules.sql
      # 与 mall-portal 共享同一 H2 数据库：portal 启动时已建表+加载数据；
      # admin 只需确保缺失的 admin 专属表存在（schema-h2.sql 已改为 CREATE TABLE IF NOT EXISTS），
      # 不再加载 data-locations，避免主键冲突 / 数据覆盖。
      data-locations: ''
  h2:
    console:
      enabled: true
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleteFlag
      logic-not-delete-value: 0
      logic-delete-value: 2

pagehelper:
  helper-dialect: h2
  reasonable: true

jwt:
  secret: "mall-admin-secret-key-2024-must-be-long-enough-for-hmac-sha256-sign"
  expire: 3600000

springdoc:
  api-docs:
    enabled: true
