server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 商家端 (mall-admin :8081) - strip /admin-api prefix, forward to /xxx
    location /admin-api/ {
        proxy_pass http://admin:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户端 (mall-portal :8080) - strip /api prefix, forward to /xxx
    location /api/ {
        proxy_pass http://portal:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: Vue Router history fallback (also safe for hash mode)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
